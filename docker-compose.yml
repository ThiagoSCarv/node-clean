services:
  postgres:
    image: postgres:17
    container_name: nest-clean-pg
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: nest-clean
    volumes:
      - nest-clean-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nest-clean']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nest-clean-pg-data:
